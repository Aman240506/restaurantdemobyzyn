    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #1a0202;
            color: #f8f4eb;
            scroll-behavior: smooth;
        }
        h1, h2, h3, h4, .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .royal-border {
            border: 2px solid #C5A028;
            position: relative;
        }
        .royal-border::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            border: 1px solid #C5A028;
            pointer-events: none;
        }
        .gold-gradient {
            background: linear-gradient(135deg, #C5A028 0%, #E8D48A 50%, #C5A028 100%);
        }
        .text-gold {
            color: #C5A028;
        }
        .bg-maroon {
            background-color: #4A0404;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1a0202;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #C5A028;
            border-radius: 3px;
        }
    </style>
